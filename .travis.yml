language: node_js
node_js:
  # VuePress 2.0.0-rc.31 engines require Node.js >=22.18.0
  - 22
install:
  - npm ci
script:
  - npm run docs:build
deploy:
  provider: pages
  skip_cleanup: true
  local_dir: docs/.vuepress/dist
  keep_history: true
  fqdn: www.zidon.net
  token: $GITHUB_TOKEN
  on:
    branch: master

