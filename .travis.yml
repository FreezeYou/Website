language: node_js
node_js:
  # npm 12 requires Node.js >=22.22.2 on the Node 22 release line
  - 22
install:
  - npm install --global npm@12.0.2
  - npm ci
script:
  - npm run docs:build
deploy:
  provider: pages
  skip_cleanup: true
  local_dir: docs/.vuepress/dist
  keep_history: true
  fqdn: www.zidon.net
  token: $GITHUB_TOKEN
  on:
    branch: master

